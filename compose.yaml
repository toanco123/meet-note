# Chạy toàn bộ:            docker compose up --build
# Chỉ hạ tầng (dev local): docker compose up -d postgres redis rustfs   rồi   pnpm start:dev
name: meetnote

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    # Tường minh: không ghi thì Docker build stage CUỐI của Dockerfile — là `worker` (M6).
    target: runtime
  image: meetnote:local
  environment: &app-env
    NODE_ENV: development # bật Swagger; production thì tắt
    LOG_LEVEL: info
    DATABASE_URL: postgres://meetnote:meetnote@postgres:5432/meetnote
    REDIS_URL: redis://redis:6379
    JWT_ACCESS_SECRET: dev-only-secret-change-me-0123456789abcdef # chỉ cho local
    S3_ENDPOINT: http://rustfs:9000
    S3_REGION: us-east-1
    S3_BUCKET: meetnote
    S3_ACCESS_KEY_ID: meetnote # khớp RUSTFS_ACCESS_KEY bên dưới
    S3_SECRET_ACCESS_KEY: meetnote-secret
    S3_FORCE_PATH_STYLE: 'true' # RustFS cần path-style
    S3_CREATE_BUCKET: 'true' # local: tạo bucket lúc khởi động
    REALTIME_CORS_ORIGINS: http://localhost:3000 # trang /realtime-test.html (dev)
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: meetnote
      POSTGRES_PASSWORD: meetnote
      POSTGRES_DB: meetnote
    ports:
      - '5432:5432'
    volumes:
      # BẪY PG18: image postgres:18 đổi PGDATA thành /var/lib/postgresql/18/docker.
      # Mount thư mục cha /var/lib/postgresql (không phải .../data như các bản cũ).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meetnote -d meetnote']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    # noeviction: BẮT BUỘC cho BullMQ — Redis đầy bộ nhớ không được tự xoá key của job.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Object storage tương thích S3 (thay MinIO). Dùng từ M5.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: meetnote
      RUSTFS_SECRET_KEY: meetnote-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - s3data:/data

  migrate:
    <<: *app
    command: ['node', 'dist/scripts/migrate.js']
    environment:
      <<: *app-env
      # Chạy bằng CHỦ schema (DATABASE_URL chung ở trên); tạo / cập nhật user đăng nhập của api,
      # worker (M11 B6). Mật khẩu chỉ cho local — production lấy từ secret.
      DB_API_PASSWORD: dev-api-password
      DB_WORKER_PASSWORD: dev-worker-password
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', '--enable-source-maps', 'dist/main.js']
    environment:
      <<: *app-env
      # Không superuser, chỉ DML, bị RLS (M11 B6–B7).
      DATABASE_URL: postgres://meetnote_api_login:dev-api-password@postgres:5432/meetnote
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    # Image riêng: runtime + ffmpeg + whisper-cli build từ source (M6).
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: meetnote-worker:local
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    environment:
      <<: *app-env
      DATABASE_URL: postgres://meetnote_worker_login:dev-worker-password@postgres:5432/meetnote
      DATABASE_STATEMENT_TIMEOUT_MS: '60000' # job theo lô chạy lâu hơn request (M11 B1)
      # Whisper trong container chỉ chạy CPU (macOS: Docker không có Metal) → model nhỏ cho thử;
      # họp thật nên chạy worker native (`pnpm start:worker`, README). Tải model: README.
      SPEECH_PROVIDER: whisper
      WHISPER_MODEL_PATH: /models/${WHISPER_MODEL_FILE:-ggml-base.bin}
      # fake: tóm tắt giả. anthropic: GỬI transcript lên Claude API (cần ANTHROPIC_API_KEY).
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Model ggml trên máy host (cùng chỗ README hướng dẫn tải), chỉ đọc.
      - ${WHISPER_MODEL_DIR:-${HOME}/.cache/meetnote/whisper}:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    # Thời gian chờ job đang chạy kết thúc khi `docker compose stop`.
    stop_grace_period: 60s

volumes:
  pgdata:
  redisdata:
  s3data:
