name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Đọc phiên bản pnpm từ field "packageManager" trong package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      # M6: test integration chạy ffmpeg / ffprobe THẬT (bắt lỗi tham số thật, M6 Q3).
      - name: Cài ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # Runner ubuntu có sẵn Docker → Testcontainers chạy Postgres/Redis thật.
      - name: E2E test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: OpenAPI không bị lệch so với code
        run: |
          pnpm openapi:export
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json chưa cập nhật. Chạy 'pnpm build && pnpm openapi:export' rồi commit."
            exit 1
          }

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # api + migrate. `target` tường minh: stage cuối của Dockerfile là `worker` (M6).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          tags: meetnote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # worker: + ffmpeg + whisper.cpp build từ source (M6). `load` để chạy thử bên dưới.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: false
          load: true
          tags: meetnote-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Binary chạy được trên MÁY KHÁC máy build (thiếu .so / `SIGILL` do `-march=native` lộ ở đây).
      - name: whisper-cli + ffmpeg trong image worker
        run: |
          docker run --rm --entrypoint sh meetnote-worker:ci -c \
            'whisper-cli --version 2>&1 && ffmpeg -hide_banner -version | head -1'
